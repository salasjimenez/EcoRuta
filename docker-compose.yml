services:
  postgres:
    image: postgres:17-alpine
    container_name: ecoruta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Define DB_NAME antes de iniciar Docker}
      POSTGRES_USER: ${DB_USER:?Define DB_USER antes de iniciar Docker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD antes de iniciar Docker}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ecoruta_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ecoruta_postgres_data:
